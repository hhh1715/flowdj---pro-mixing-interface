<g id="flow" transform="translate(8,268)">
  <text class="title" x="0" y="0">建議流程（詳見 docs/hardware/08-prototype-assembly.md）</text>
  <text class="body" x="0" y="4">1. 印這張 → 量右上校正方塊 → 10 mm 才繼續。</text>
  <text class="body" x="0" y="7.5">2. 銅箔膠帶覆貼在紙上每個電極形狀 → 美工刀沿實線連紙一起剪。</text>
  <text class="body" x="0" y="11">3. 撕下貼到壓克力板；焊線尾朝外 → 焊或導電膠接杜邦線 → 接到對應 MPR121 腳。</text>
  <text class="body" x="0" y="14.5">4. 30 點全接完 → 跑 06-testing-plan.md Phase 1–4。 channel 對照：M#1 0x5A (Jog+CUE/Play/SYNC/PAD1)  M#2 0x5B (Tempo+PAD2/3)  M#3 0x5C (Volume+PAD4)</text>
</g>
<rect class="frame" x="5" y="5" width="200" height="287" />
</svg>
