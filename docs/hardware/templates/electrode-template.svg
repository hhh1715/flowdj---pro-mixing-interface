<g id="flow" transform="translate(8,260)">
  <text class="title" x="0" y="0">建議流程（詳見 docs/hardware/08-prototype-assembly.md）</text>
  <text class="body" x="0" y="5">1. 印這張（100% 比例）→ 量右上校正方塊 = 10 mm → 才往下做。</text>
  <text class="body" x="0" y="9">2. 銅箔膠帶覆貼每個電極 → 美工刀沿黑實線連紙一起剪。</text>
  <text class="body" x="0" y="13">3. 撕下貼到壓克力板；焊線尾（虛線片）朝板邊 → 焊 / 導電膠接杜邦線 → 拉到對應 MPR121 腳。</text>
  <text class="body" x="0" y="17">4. 30 點全接完 → 跑 06-testing-plan.md Phase 1–4 驗通道。</text>
  <text class="body" x="0" y="22" font-weight="700">M#1 0x5A: Jog+CUE+Play+SYNC+PAD1 · M#2 0x5B: Tempo+PAD2/3 · M#3 0x5C: Volume+PAD4</text>
</g>
<rect class="frame" x="5" y="5" width="200" height="287"/>
</svg>
